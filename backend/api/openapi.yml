openapi: 3.0.3

info:
  title: task-per-minute Backend API
  description: |
    REST surface for the Task Per Minute service. Tournament realtime WebSocket
    endpoints use the public, participant, and operator tournament paths and
    are intentionally outside this OpenAPI spec.

    Tournament realtime uses a snapshot-first durable resume model. Ordering
    is backed by the durable per-tournament outbox sequence, which may be zero
    and does not restart for a new connection. Each connection receives a
    consistent full snapshot at the current watermark before events with newer
    sequences are delivered. A reconnect may provide a role-scoped resume_id
    while its durable subscriber record is retained. If resume fails, the
    client reconnects without resume_id and accepts a fresh full snapshot.
    Terminal subscribers and their receipts use the configured retention
    window, which defaults to 720 hours. Outbox events and their source evidence
    are immutable and are not pruned.

    Authentication:
      - Players use the HttpOnly `tpm_player_session` cookie issued by POST /api/v1/players/join.
      - Admins use the HttpOnly `tpm_admin_access` and `tpm_admin_refresh` cookies issued by
        POST /api/v1/admin/login and POST /api/v1/admin/refresh. Unsafe admin requests must send `X-CSRF-Token`.
        Refresh/logout requests send the refresh CSRF token in `X-CSRF-Token`.
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: /
    description: Current API origin

tags:
  - name: admin
    description: Admin session lifecycle operations.
  - name: player
    description: Player session, identity, and operator-managed player operations.
  - name: task
    description: Operator-managed task operations.
  - name: tournament
    description: Tournament administration, participant commands, and public projections.
  - name: leaderboard
    description: Public tournament leaderboard reads.
  - name: system
    description: Service health operations.

