/api/v1/players/join:
  post:
    operationId: joinPlayer
    tags: [player]
    deprecated: true
    summary: Retired nickname-only player join
    description: >
      Retired for account-backed player identities. The endpoint rejects all
      nickname-only requests with 410 Gone. Use registration, email
      verification, and password login instead.
    security: []
    responses:
      '410':
        description: Nickname-only session creation is retired.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '403':
        description: Request origin or referer is not allowed.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '409':
        description: Username already has an active session.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '413':
        description: Request body exceeds the JSON size limit.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '415':
        description: Request content type must be application/json.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '429':
        description: Too many join attempts from the same client IP.
        headers:
          Retry-After:
            description: Seconds until the join rate window resets.
            schema:
              type: string
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'

/api/v1/players/register:
  post:
    operationId: registerPlayer
    tags: [player]
    summary: Register a player account
    description: |
      Creates a pending account and sends an email verification link. The
      accepted response is the same for an already registered email address.
      A username already reserved by a player returns 409.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/PlayerRegistrationRequest'
    responses:
      '202':
        description: Registration was accepted for processing.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/PlayerAccountAcceptedResponse'
      '400':
        description: Invalid username, email, or password.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '403':
        description: Request origin or referer is not allowed.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '409':
        description: Username is already reserved.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '413':
        description: Request body exceeds the JSON size limit.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '415':
        description: Request content type must be application/json.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '429':
        description: Too many account requests from the same client IP.
        headers:
          Retry-After:
            schema:
              type: string
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '503':
        description: Email verification is temporarily unavailable.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'

/api/v1/players/login:
  post:
    operationId: loginPlayer
    tags: [player]
    summary: Log in to a verified player account
    description: |
      Accepts a case-insensitive username or email address. Invalid credentials
      return a generic response. A correct password for an unverified account
      returns code `player.email_unverified` with an activation instruction.
      Neither failure issues a session. Success issues the existing HttpOnly
      player session cookie and a session-bound CSRF token.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/PlayerLoginRequest'
    responses:
      '200':
        description: Player session created.
        headers:
          X-CSRF-Token:
            description: CSRF token bound to the issued HttpOnly player session cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/JoinPlayerResponse'
      '400':
        description: Invalid request body.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '401':
        description: Invalid credentials or an unverified account. A correct password for a pending account uses code player.email_unverified.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '403':
        description: Request origin or referer is not allowed.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '413':
        description: Request body exceeds the JSON size limit.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '415':
        description: Request content type must be application/json.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '429':
        description: Too many login requests from the same client IP.
        headers:
          Retry-After:
            schema:
              type: string
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'

/api/v1/players/login/resend-verification:
  post:
    operationId: resendPlayerVerificationForLogin
    tags: [player]
    summary: Resend verification after confirming login credentials
    description: |
      Accepts the same username-or-email and password fields as player login.
      A verification link is sent only to the email address stored for the
      pending account. Successful delivery returns 202. Incorrect credentials
      return a generic 401. A correct password for an already verified account
      returns code `player.email_already_verified`. This operation never creates
      or issues a player session.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/PlayerLoginRequest'
    responses:
      '202':
        description: A new verification email was sent.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/PlayerAccountAcceptedResponse'
      '400':
        description: Invalid request body.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '401':
        description: Login credentials are invalid.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '403':
        description: Request origin or referer is not allowed.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '409':
        description: Email is already verified.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '413':
        description: Request body exceeds the JSON size limit.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '415':
        description: Request content type must be application/json.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '429':
        description: Verification resend cooldown is active.
        headers:
          Retry-After:
            description: Seconds until another verification email can be sent.
            schema:
              type: string
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '503':
        description: Email verification is temporarily unavailable.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'

