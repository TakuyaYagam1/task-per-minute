/api/v1/admin/login:
  post:
    operationId: loginAdmin
    tags: [admin]
    summary: Exchange the shared admin password for an admin session
    description: >
      Sets HttpOnly tpm_admin_access and tpm_admin_refresh cookies. Unsafe admin
      requests must use X-CSRF-Token with the access CSRF token. Refresh and
      logout send the refresh CSRF token in X-CSRF-Token.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/AdminLoginRequest'
    responses:
      '200':
        description: Login OK.
        headers:
          X-CSRF-Token:
            description: CSRF token bound to the HttpOnly tpm_admin_access cookie.
            schema:
              type: string
          X-Admin-Refresh-CSRF-Token:
            description: CSRF token bound to the HttpOnly tpm_admin_refresh cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/AdminSessionResponse'
      '400':
        description: Invalid request body.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '401':
        description: Invalid password.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '403':
        description: Request origin or referer is not allowed.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '413':
        description: Request body exceeds the JSON size limit.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '415':
        description: Request content type must be application/json.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '429':
        description: Too many login attempts from the same client IP.
        headers:
          Retry-After:
            description: Seconds until the login rate window resets.
            schema:
              type: string
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'

/api/v1/admin/refresh:
  post:
    operationId: refreshAdminSession
    tags: [admin]
    summary: Rotate the admin session
    description: >
      Rotates the session from the HttpOnly tpm_admin_refresh cookie and
      refreshes both HttpOnly admin cookies. The request must send the refresh
      CSRF token in X-CSRF-Token.
    security:
      - AdminRefreshSessionAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/AdminCSRFToken'
    responses:
      '200':
        description: Session rotated.
        headers:
          X-CSRF-Token:
            description: CSRF token bound to the refreshed HttpOnly tpm_admin_access cookie.
            schema:
              type: string
          X-Admin-Refresh-CSRF-Token:
            description: CSRF token bound to the refreshed HttpOnly tpm_admin_refresh cookie.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/AdminSessionResponse'
      '400':
        description: Missing or invalid CSRF header.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '401':
        description: Refresh session missing, invalid, expired, or revoked.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '403':
        description: CSRF token does not match the refresh session, or the request origin or referer is not allowed.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '429':
        description: Too many refresh attempts from the same client IP.
        headers:
          Retry-After:
            description: Seconds until the refresh rate window resets.
            schema:
              type: string
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'

/api/v1/admin/logout:
  post:
    operationId: logoutAdmin
    tags: [admin]
    summary: Revoke the admin session
    description: |
      Revokes the session from the HttpOnly tpm_admin_refresh cookie so it can
      no longer be refreshed. The access session is also revoked when its
      cookie is present. Logout does not require a
      currently valid access session, so an expired browser session can still
      revoke its refresh session and clear auth cookies.
      Requests must send the refresh CSRF token in X-CSRF-Token.
    security:
      - AdminRefreshSessionAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/AdminCSRFToken'
    responses:
      '204':
        description: Session revoked.
      '400':
        description: Missing or invalid CSRF header.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '401':
        description: Refresh session missing, invalid, expired, or revoked.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '403':
        description: CSRF token does not match the refresh session, or the request origin or referer is not allowed.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'
