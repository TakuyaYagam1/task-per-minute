components:
  parameters:
    ArenaTournamentId:
      in: path
      name: tournament_id
      required: true
      schema:
        type: string
        format: uuid
    ArenaWaveId:
      in: path
      name: wave_id
      required: true
      schema:
        type: string
        format: uuid
    ArenaSeriesId:
      in: path
      name: series_id
      required: true
      schema:
        type: string
        format: uuid
    ArenaGameId:
      in: path
      name: game_id
      required: true
      schema:
        type: string
        format: uuid
    ArenaAssignmentId:
      in: path
      name: assignment_id
      required: true
      schema:
        type: string
        format: uuid
    ArenaIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        format: uuid
    ArenaAdminCSRFToken:
      in: header
      name: X-CSRF-Token
      required: false
      description: Required only for cookie-authenticated browser admin requests.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ArenaCSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ArenaOperatorTournamentState:
      in: query
      name: state
      required: false
      schema:
        $ref: '../components/schemas/arena_schemas.yml#/ArenaTournamentState'
    ArenaOperatorListCursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
        maxLength: 1024
    ArenaOperatorListPageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
    ArenaPublicCursor:
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/ArenaPublicRecoveryCursor'
    ArenaParticipantCursor:
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/ArenaParticipantRecoveryCursor'
    ArenaOperatorCursor:
      in: query
      name: cursor
      required: false
      schema:
        $ref: '#/components/schemas/ArenaOperatorRecoveryCursor'
    ArenaAuditTournamentId:
      in: query
      name: tournament_id
      required: true
      schema:
        type: string
        format: uuid
    ArenaAuditEntityKind:
      in: query
      name: entity_kind
      required: false
      schema:
        $ref: '../components/schemas/arena_schemas.yml#/ArenaAuditEntityKind'
    ArenaAuditEntityId:
      in: query
      name: entity_id
      required: false
      schema:
        type: string
        format: uuid
    ArenaAuditEventType:
      in: query
      name: event_type
      required: false
      schema:
        type: string
        maxLength: 64
    ArenaAuditActorKind:
      in: query
      name: actor_kind
      required: false
      schema:
        $ref: '../components/schemas/arena_schemas.yml#/ArenaResultActorKind'
    ArenaAuditActorId:
      in: query
      name: actor_id
      required: false
      schema:
        type: string
        format: uuid
    ArenaAuditResultReason:
      in: query
      name: result_reason
      required: false
      schema:
        type: string
        maxLength: 40
    ArenaAuditOccurredFrom:
      in: query
      name: occurred_from
      required: false
      schema:
        type: string
        format: date-time
    ArenaAuditOccurredTo:
      in: query
      name: occurred_to
      required: false
      schema:
        type: string
        format: date-time
    ArenaAuditCursor:
      in: query
      name: cursor
      required: false
      style: deepObject
      explode: true
      schema:
        $ref: '../components/schemas/arena_schemas.yml#/ArenaAuditCursor'
    ArenaAuditPageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

  responses:
    ArenaInvalidRequestResponse:
      description: The Arena command payload violates a semantic request rule.
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/common_schemas.yml#/ProblemDetails'
    ArenaUnauthorizedResponse:
      description: The authenticated session is missing, invalid, or expired.
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/common_schemas.yml#/ProblemDetails'
    ArenaForbiddenResponse:
      description: The authenticated actor lacks access to this tournament or role.
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/common_schemas.yml#/ProblemDetails'
    ArenaNotFoundResponse:
      description: The requested Arena resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/common_schemas.yml#/ProblemDetails'
    ArenaRevisionConflictResponse:
      description: The expected Arena projection revision is stale.
      content:
        application/json:
          schema:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaRevisionConflict'
    ArenaRateLimitedResponse:
      description: The authenticated participant exceeded the Arena command rate limit.
      headers:
        Retry-After:
          description: Seconds until the participant may retry the command.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../components/schemas/common_schemas.yml#/ProblemDetails'

  schemas:
    ArenaCreateTournamentRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, preset, roster_size]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 0
        preset:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaPreset'
        roster_size:
          type: integer
          format: int32
          minimum: 4
          maximum: 16
    ArenaOperatorTournamentList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaTournament'
        next_cursor:
          type: string
          maxLength: 1024
          nullable: true
    ArenaRosterParticipantInput:
      type: object
      additionalProperties: false
      required: [player_id, seed, attendance]
      properties:
        player_id:
          type: string
          format: uuid
        seed:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        attendance:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaAttendanceState'
    ArenaReplaceRosterRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, participants]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        participants:
          type: array
          minItems: 4
          maxItems: 16
          items:
            $ref: '#/components/schemas/ArenaRosterParticipantInput'
    ArenaPreflightRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
    ArenaLockRosterRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, preflight_revision_id, checked_in_player_ids]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        preflight_revision_id:
          type: string
          format: uuid
        checked_in_player_ids:
          type: array
          minItems: 4
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            format: uuid
    ArenaUnlockRosterRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, confirmed, reason]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        confirmed:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 512
    ArenaManualPairInput:
      type: object
      additionalProperties: false
      required: [first_participant_id, second_participant_id]
      properties:
        first_participant_id:
          type: string
          format: uuid
        second_participant_id:
          type: string
          format: uuid
    ArenaPairingRepeatOverrideRequest:
      type: object
      additionalProperties: false
      required: [confirmed, reason]
      properties:
        confirmed:
          type: boolean
        reason:
          type: string
          minLength: 1
          maxLength: 512
    ArenaPairingConfigurationRequest:
      type: object
      additionalProperties: false
      description: Manual mode requires complete manual_pairings and an explicit nullable bye. Repeated pairs require repeat_override evidence.
      required: [expected_projection_revision, round_number, pairing_mode, category_mode, categories]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        round_number:
          type: integer
          format: int32
          minimum: 1
          maximum: 4
        pairing_mode:
          type: string
          enum: [automatic, manual]
        category_mode:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaCategoryMode'
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaCategory'
        manual_pairings:
          type: array
          minItems: 2
          maxItems: 8
          items:
            $ref: '#/components/schemas/ArenaManualPairInput'
        manual_bye_participant_id:
          type: string
          format: uuid
          nullable: true
        repeat_override:
          $ref: '#/components/schemas/ArenaPairingRepeatOverrideRequest'
    ArenaTournamentActionRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, action, confirmed]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [open_registration, start_swiss, start_golden, start_playoffs, pause, resume, complete, cancel]
        confirmed:
          type: boolean
        reason:
          type: string
          maxLength: 512
    ArenaWaveControlRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, action, confirmed]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [open_ready_window, start, pause, resume, complete, cancel]
        confirmed:
          type: boolean
        reason:
          type: string
          maxLength: 512
    ArenaOperatorCorrectionRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, confirmed, reason, explanation, fields, patch]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        confirmed:
          type: boolean
        reason:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaCorrectionReason'
        explanation:
          type: string
          minLength: 1
          maxLength: 512
        fields:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaCorrectionField'
        patch:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaCorrectionPatch'
        projection_intents:
          type: array
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaCorrectionProjectionIntent'
        unlock_intents:
          type: array
          maxItems: 4096
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaCorrectionUnlockIntent'
    ArenaParticipantLobbySeries:
      type: object
      additionalProperties: false
      required: [series_id, state, format, opponent_display_name, wave_id]
      properties:
        series_id:
          type: string
          format: uuid
        state:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaSeriesState'
        format:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaSeriesFormat'
        opponent_display_name:
          type: string
          maxLength: 64
        wave_id:
          type: string
          format: uuid
    ArenaParticipantLobbyResponse:
      type: object
      additionalProperties: false
      required: [tournament_id, state, projection_revision, roster_locked, series]
      properties:
        tournament_id:
          type: string
          format: uuid
        state:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaTournamentState'
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        roster_locked:
          type: boolean
        series:
          type: array
          items:
            $ref: '#/components/schemas/ArenaParticipantLobbySeries'
    ArenaParticipantAssignmentResponse:
      type: object
      additionalProperties: false
      required: [tournament_id, projection_revision, assignment]
      properties:
        tournament_id:
          type: string
          format: uuid
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        assignment:
          $ref: '#/components/schemas/ArenaParticipantAssignment'
    ArenaParticipantAssignment:
      type: object
      additionalProperties: false
      required: [id, attempt_id, active_snapshot, undisclosed_reserve_count, receipt]
      properties:
        id:
          type: string
          format: uuid
        attempt_id:
          type: string
          format: uuid
        active_snapshot:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaTaskSnapshot'
        undisclosed_reserve_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 2
        receipt:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaDeliveryReceipt'
    ArenaParticipantReadyRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, ready]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        ready:
          type: boolean
    ArenaParticipantDraftActionRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, expected_draft_revision, expected_turn, action, category]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
        expected_turn:
          type: integer
          format: int32
          minimum: 1
        action:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaDraftActionType'
        category:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaCategory'
    ArenaParticipantSubmissionRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, submitted_flag]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        submitted_flag:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    ArenaParticipantSubmissionResponse:
      type: object
      additionalProperties: false
      required: [projection_revision, submission]
      properties:
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        submission:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaSubmissionRecord'
    ArenaParticipantSurrenderRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, confirmed]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        confirmed:
          type: boolean
        reason:
          type: string
          maxLength: 512
    ArenaParticipantPostSeriesRequest:
      type: object
      additionalProperties: false
      required: [expected_projection_revision, action]
      properties:
        expected_projection_revision:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [acknowledge_result, request_next_assignment, leave_lobby]
    ArenaParticipantPostSeriesResponse:
      type: object
      additionalProperties: false
      required: [series_id, projection_revision, accepted_action]
      properties:
        series_id:
          type: string
          format: uuid
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        accepted_action:
          type: string
          enum: [acknowledge_result, request_next_assignment, leave_lobby]
    ArenaPublicTournamentResponse:
      type: object
      additionalProperties: false
      required: [tournament_id, preset, state, roster_size, started_at, finished_at, projection_revision]
      properties:
        tournament_id:
          type: string
          format: uuid
        preset:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaPreset'
        state:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaTournamentState'
        roster_size:
          type: integer
          format: int32
          minimum: 4
          maximum: 16
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        projection_revision:
          type: integer
          format: int64
          minimum: 1
    ArenaPublicScoreboardEntry:
      type: object
      additionalProperties: false
      required: [rank, display_name, points, buchholz, effective_time_ms]
      properties:
        rank:
          type: integer
          format: int32
          minimum: 1
        display_name:
          type: string
          maxLength: 64
        points:
          type: integer
          format: int32
          minimum: 0
        buchholz:
          type: integer
          format: int32
          minimum: 0
        effective_time_ms:
          type: integer
          format: int64
          minimum: 0
    ArenaPublicScoreboardResponse:
      type: object
      additionalProperties: false
      required: [tournament_id, projection_revision, entries]
      properties:
        tournament_id:
          type: string
          format: uuid
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        entries:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ArenaPublicScoreboardEntry'
    ArenaPublicBracketMatch:
      type: object
      additionalProperties: false
      required: [stage, position, first_display_name, second_display_name, score, state]
      properties:
        stage:
          type: string
          enum: [semifinal, final]
        position:
          type: integer
          format: int32
          minimum: 1
        first_display_name:
          type: string
          maxLength: 64
        second_display_name:
          type: string
          maxLength: 64
        score:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaSeriesScore'
        state:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaSeriesState'
    ArenaPublicBracketResponse:
      type: object
      additionalProperties: false
      required: [tournament_id, projection_revision, matches]
      properties:
        tournament_id:
          type: string
          format: uuid
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        matches:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ArenaPublicBracketMatch'
    ArenaPublicDraftAction:
      type: object
      additionalProperties: false
      required: [turn, actor_display_name, action, category, occurred_at]
      properties:
        turn:
          type: integer
          format: int32
          minimum: 1
        actor_display_name:
          type: string
          maxLength: 64
        action:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaDraftActionType'
        category:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaCategory'
        occurred_at:
          type: string
          format: date-time
    ArenaPublicLiveDraftResponse:
      type: object
      additionalProperties: false
      required: [tournament_id, series_id, projection_revision, format, state, pool, actions, selected_categories]
      properties:
        tournament_id:
          type: string
          format: uuid
        series_id:
          type: string
          format: uuid
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        format:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaSeriesFormat'
        state:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaDraftState'
        pool:
          type: array
          maxItems: 5
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaCategory'
        actions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ArenaPublicDraftAction'
        selected_categories:
          type: array
          maxItems: 3
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaCategory'
    ArenaPublicRecoveryCursor:
      type: object
      additionalProperties: false
      required: [projection_revision, event_sequence]
      properties:
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        event_sequence:
          type: integer
          format: int64
          minimum: 0
    ArenaParticipantRecoveryCursor:
      type: object
      additionalProperties: false
      required: [projection_revision, participant_view_revision, event_sequence]
      properties:
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        participant_view_revision:
          type: integer
          format: int64
          minimum: 1
        event_sequence:
          type: integer
          format: int64
          minimum: 0
    ArenaOperatorRecoveryCursor:
      type: object
      additionalProperties: false
      required: [projection_revision, authority_revision, audit_sequence]
      properties:
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        authority_revision:
          type: integer
          format: int64
          minimum: 1
        audit_sequence:
          type: integer
          format: int64
          minimum: 0
    ArenaPublicRecoverySnapshot:
      type: object
      additionalProperties: false
      required: [tournament, scoreboard, bracket, live_draft, next_cursor]
      properties:
        tournament:
          $ref: '#/components/schemas/ArenaPublicTournamentResponse'
        scoreboard:
          $ref: '#/components/schemas/ArenaPublicScoreboardResponse'
        bracket:
          $ref: '#/components/schemas/ArenaPublicBracketResponse'
        live_draft:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ArenaPublicLiveDraftResponse'
        next_cursor:
          $ref: '#/components/schemas/ArenaPublicRecoveryCursor'
    ArenaParticipantRecoverySnapshot:
      type: object
      additionalProperties: false
      required: [tournament_id, projection_revision, lobby, series, wave, draft, assignment, next_cursor]
      properties:
        tournament_id:
          type: string
          format: uuid
        projection_revision:
          type: integer
          format: int64
          minimum: 1
        lobby:
          $ref: '#/components/schemas/ArenaParticipantLobbyResponse'
        series:
          nullable: true
          allOf:
            - $ref: '../components/schemas/arena_schemas.yml#/ArenaSeries'
        wave:
          nullable: true
          allOf:
            - $ref: '../components/schemas/arena_schemas.yml#/ArenaWave'
        draft:
          nullable: true
          allOf:
            - $ref: '../components/schemas/arena_schemas.yml#/ArenaDraft'
        assignment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ArenaParticipantAssignment'
        next_cursor:
          $ref: '#/components/schemas/ArenaParticipantRecoveryCursor'
    ArenaOperatorRecoverySnapshot:
      type: object
      additionalProperties: false
      required: [tournament, roster, waves, series, pause_graph, next_cursor]
      properties:
        tournament:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaTournament'
        roster:
          $ref: '../components/schemas/arena_schemas.yml#/ArenaRoster'
        waves:
          type: array
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaWave'
        series:
          type: array
          items:
            $ref: '../components/schemas/arena_schemas.yml#/ArenaSeries'
        pause_graph:
          nullable: true
          allOf:
            - $ref: '../components/schemas/arena_schemas.yml#/ArenaPauseGraph'
        next_cursor:
          $ref: '#/components/schemas/ArenaOperatorRecoveryCursor'

/api/v1/arena/operator/tournaments:
  get:
    operationId: listArenaOperatorTournaments
    tags: [arena-operator]
    summary: List Arena tournaments for the authenticated operator
    x-arena-auth-scope: operator:arena
    security:
      - BearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ArenaOperatorTournamentState'
      - $ref: '#/components/parameters/ArenaOperatorListCursor'
      - $ref: '#/components/parameters/ArenaOperatorListPageSize'
    responses:
      '200':
        description: Operator tournament page.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArenaOperatorTournamentList'
      '401':
        $ref: '#/components/responses/ArenaUnauthorizedResponse'
      '403':
        $ref: '#/components/responses/ArenaForbiddenResponse'
  post:
    operationId: createArenaTournament
    tags: [arena-operator]
    summary: Create an Arena tournament
