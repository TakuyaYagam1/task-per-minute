/api/v1/admin/tournaments:
  get:
    operationId: listTournaments
    tags: [tournament]
    summary: List tournaments for the authenticated operator
    x-auth-scope: tournament:manage
    security:
      - AdminSessionAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/TournamentStateFilter'
      - $ref: '../components/parameters.yml#/TournamentListCursor'
      - $ref: '../components/parameters.yml#/TournamentPageSize'
    responses:
      '200':
        description: Operator tournament page.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TournamentListResponse'
      '401':
        $ref: '../components/responses.yml#/UnauthorizedProblem'
      '403':
        $ref: '../components/responses.yml#/ForbiddenProblem'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'
  post:
    operationId: createTournament
    tags: [tournament]
    summary: Create a tournament
    description: |
      Operator identity comes from the authenticated session. The
      content_revision is bound exactly to the selected published content
      revision returned by GET /api/v1/admin/tournament-content and is never
      silently upgraded. If a previously selected revision is no longer usable,
      refresh that GET and retry with the returned selection. Publishing a new
      catalog publication does not change the content bound to existing
      tournaments. A previously selected healthy and enabled published
      revision remains acceptable after a newer publication is available.
    x-auth-scope: tournament:manage
    security:
      - AdminSessionAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/IdempotencyKey'
      - $ref: '../components/parameters.yml#/AdminCSRFToken'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/CreateTournamentRequest'
    responses:
      '201':
        description: Tournament created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/Tournament'
      '401':
        $ref: '../components/responses.yml#/UnauthorizedProblem'
      '403':
        $ref: '../components/responses.yml#/ForbiddenProblem'
      '409':
        $ref: '../components/responses.yml#/TournamentRevisionConflictProblem'

      '422':
        description: The selected content revision is missing or no longer usable.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'

      '400':
        $ref: '../components/responses.yml#/InvalidRequestProblem'
      '413':
        $ref: '../components/responses.yml#/RequestEntityTooLargeProblem'
      '415':
        $ref: '../components/responses.yml#/UnsupportedMediaTypeProblem'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'
/api/v1/admin/tournament-content:
  get:
    operationId: getTournamentContent
    tags: [tournament]
    summary: Discover the current published tournament content selection
    description: |
      Returns the published content selection currently usable for creating a
      tournament. This selection confirms the publication and pool revisions
      that CreateTournament will bind exactly. It does not replace tournament
      preflight checks for roster capacity or launch readiness.

      If an older selection is no longer usable, refresh this GET and use the
      returned selection for the create request. Publishing a new catalog
      publication does not invalidate or rewrite the immutable content binding
      of an existing tournament.
    x-auth-scope: tournament:manage
    security:
      - AdminSessionAuth: []
    responses:
      '200':
        description: Current published content selection.
        headers:
          Cache-Control:
            description: The current selection must not be stored by browsers or intermediary caches.
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TournamentContentSelection'
      '401':
        $ref: '../components/responses.yml#/UnauthorizedProblem'
      '403':
        $ref: '../components/responses.yml#/ForbiddenProblem'
      '422':
        description: No currently usable published content selection exists.
        content:
          application/problem+json:
            schema:
              $ref: '../components/schemas.yml#/ProblemDetails'
      '429':
        $ref: '../components/responses.yml#/RateLimitedProblem'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'
/api/v1/admin/tournaments/{tournament_id}/configuration:
  parameters:
    - $ref: '../components/parameters.yml#/TournamentId'
  get:
    operationId: getTournamentConfiguration
    tags: [tournament]
    summary: Read the operator tournament configuration
    description: >-
      Returns the authoritative tournament category pools and stage defaults.
      The final configuration is immutable BO3 with a five-category draft. The
      response is never stored by browsers or intermediary caches.
    x-auth-scope: tournament:manage
    security:
      - AdminSessionAuth: []
    responses:
      '200':
        description: Operator tournament configuration.
        headers:
          Cache-Control:
            description: Configuration must not be stored by browsers or intermediary caches.
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TournamentConfiguration'
      '401':
        $ref: '../components/responses.yml#/UnauthorizedProblem'
      '403':
        $ref: '../components/responses.yml#/ForbiddenProblem'
      '404':
        $ref: '../components/responses.yml#/NotFoundProblem'
      '422':
        $ref: '../components/responses.yml#/InvalidRequestProblem'
      '429':
        $ref: '../components/responses.yml#/RateLimitedProblem'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'
  patch:
    operationId: updateTournamentConfiguration
    tags: [tournament]
    summary: Update Swiss and semifinal tournament defaults
    description: >-
      Updates only the mutable Swiss and semifinal defaults and category pools.
      The final BO3 five-category draft is immutable. The command requires both
      the tournament projection and configuration revisions plus explicit
      confirmation and unlock evidence.
    x-auth-scope: tournament:manage
    security:
      - AdminSessionAuth: []
    parameters:
      - $ref: '../components/parameters.yml#/IdempotencyKey'
      - $ref: '../components/parameters.yml#/AdminCSRFToken'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yml#/UpdateTournamentConfigurationRequest'
    responses:
      '200':
        description: Immutable evidence for the tournament configuration mutation.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yml#/TournamentConfigurationMutationEvidence'
      '400':
        $ref: '../components/responses.yml#/InvalidRequestProblem'
      '401':
        $ref: '../components/responses.yml#/UnauthorizedProblem'
      '403':
        $ref: '../components/responses.yml#/ForbiddenProblem'
      '404':
        $ref: '../components/responses.yml#/NotFoundProblem'
      '409':
        $ref: '../components/responses.yml#/ProjectionRevisionConflictProblem'
      '422':
        $ref: '../components/responses.yml#/InvalidRequestProblem'
      '429':
        $ref: '../components/responses.yml#/RateLimitedProblem'
      default:
        $ref: '../components/responses.yml#/UnexpectedServerProblem'
