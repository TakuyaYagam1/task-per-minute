AdminLoginRequest:
  type: object
  additionalProperties: false
  required: [password]
  properties:
    password:
      type: string
      minLength: 1
      maxLength: 256

AdminSessionResponse:
  type: object
  required: [expires_in]
  properties:
    expires_in:
      type: integer
      format: int32
      minimum: 0
      description: Seconds until the admin access session expires.
