TournamentPreset:
  type: string
  enum: [tournament_v1]
  x-enum-varnames: [TournamentPresetV1]

TournamentState:
  type: string
  enum: [draft, registration, roster_locked, swiss, golden, playoffs, technical_pause, completed, cancelled]
  x-enum-varnames:
    - TournamentStateDraft
    - TournamentStateRegistration
    - TournamentStateRosterLocked
    - TournamentStateSwiss
    - TournamentStateGolden
    - TournamentStatePlayoffs
    - TournamentStateTechnicalPause
    - TournamentStateCompleted
    - TournamentStateCancelled

Tournament:
  type: object
  required: [id, roster_id, preset, name, public_id, planned_roster_size, content_revision, state, revision, roster_size, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    roster_id:
      type: string
      format: uuid
    preset:
      $ref: '#/TournamentPreset'
    name:
      type: string
      minLength: 1
      maxLength: 120
    public_id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    planned_roster_size:
      type: integer
      format: int32
      minimum: 4
      maximum: 16
    content_revision:
      type: integer
      format: int64
      minimum: 1
    state:
      $ref: '#/TournamentState'
    paused_from_state:
      type: string
      nullable: true
      allOf:
        - $ref: '#/TournamentState'
    revision:
      type: integer
      format: int64
      minimum: 1
      readOnly: true
    roster_size:
      type: integer
      format: int32
      minimum: 0
      maximum: 16
    created_at:
      type: string
      format: date-time
      readOnly: true
    updated_at:
      type: string
      format: date-time
      readOnly: true
    started_at:
      type: string
      format: date-time
      nullable: true
      readOnly: true
    finished_at:
      type: string
      format: date-time
      nullable: true
      readOnly: true

CreateTournamentRequest:
  type: object
  additionalProperties: false
  required: [expected_revision, preset, name, public_id, planned_roster_size, content_revision]
  properties:
    expected_revision:
      type: integer
      format: int64
      minimum: 0
    preset:
      $ref: '#/TournamentPreset'
    name:
      type: string
      minLength: 1
      maxLength: 120
    public_id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    planned_roster_size:
      type: integer
      format: int32
      minimum: 4
      maximum: 16
    content_revision:
      type: integer
      format: int64
      minimum: 1

DeleteTournamentRequest:
  type: object
  additionalProperties: false
  required: [expected_revision, confirmed]
  properties:
    expected_revision:
      type: integer
      format: int64
      minimum: 1
    confirmed:
      type: boolean
      enum: [true]

TournamentListResponse:
  type: object
  additionalProperties: false
  required: [items, next_cursor]
  properties:
    items:
      type: array
      maxItems: 200
      items:
        $ref: '#/Tournament'
    next_cursor:
      type: string
      maxLength: 1024
      nullable: true

TournamentContentSelection:
  type: object
  additionalProperties: false
  description: |
    The currently published content selection that can be bound to a new
    tournament. The selected pool revision identifiers are immutable once a
    tournament is created. A later catalog publication does not rewrite prior
    tournament bindings.
  required: [content_revision, publication_id, published_at, normal_pool_revision_id, golden_pool_revision_id]
  properties:
    content_revision:
      type: integer
      format: int64
      minimum: 1
      description: Monotonic published content revision to send unchanged when creating a tournament.
    publication_id:
      type: string
      format: uuid
      description: Immutable publication identity for this content revision.
    published_at:
      type: string
      format: date-time
      description: Server timestamp at which this publication became current.
    normal_pool_revision_id:
      type: string
      format: uuid
      description: Selected normal task pool revision bound to a new tournament.
    golden_pool_revision_id:
      type: string
      format: uuid
      description: Selected Golden task pool revision bound to a new tournament.

TournamentRevisionProblem:
  description: RFC 7807 optimistic-concurrency error with the current tournament revision.
  allOf:
    - $ref: './common_schemas.yml#/ProblemDetails'
    - type: object
      required: [expected_revision, current_revision]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        current_revision:
          type: integer
          format: int64
          minimum: 1
        current_state:
          $ref: '#/TournamentState'
