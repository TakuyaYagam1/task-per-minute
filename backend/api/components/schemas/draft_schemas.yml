CategoryMode:
  type: string
  enum: [random, admin, draft]

DraftState:
  type: string
  description: Durable draft execution state. Only an active draft accepts participant actions.
  enum: [active, paused, recovery_required, completed, superseded]

DraftActionType:
  type: string
  enum: [ban, pick]

Category:
  type: string
  enum: [web, crypto, forensics, reverse, pwn, steganography, ppc, osint, mobile, hardware, misc]
  x-enum-varnames:
    - CategoryWeb
    - CategoryCrypto
    - CategoryForensics
    - CategoryReverse
    - CategoryPwn
    - CategorySteganography
    - CategoryPpc
    - CategoryOsint
    - CategoryMobile
    - CategoryHardware
    - CategoryMisc

Difficulty:
  type: string
  enum: [easy, medium, hard]
  x-enum-varnames: [DifficultyEasy, DifficultyMedium, DifficultyHard]

DraftTurn:
  type: object
  required: [number, actor_id, action, deadline]
  properties:
    number:
      type: integer
      format: int32
      minimum: 1
    actor_id:
      type: string
      format: uuid
    action:
      $ref: '#/DraftActionType'
    deadline:
      type: string
      format: date-time

DraftAction:
  type: object
  required: [turn, actor_id, action, category, occurred_at, turn_deadline, automatic, decision_evidence]
  properties:
    turn:
      type: integer
      format: int32
      minimum: 1
    actor_id:
      type: string
      format: uuid
    action:
      $ref: '#/DraftActionType'
    category:
      $ref: '#/Category'
    occurred_at:
      type: string
      format: date-time
      readOnly: true
    turn_deadline:
      type: string
      format: date-time
      readOnly: true
    automatic:
      type: boolean
      description: Whether the server recorded this action automatically after the turn deadline.
      readOnly: true
    decision_evidence:
      type: object
      nullable: true
      readOnly: true
      allOf:
        - $ref: '#/DraftDecisionEvidence'

DraftDecisionEvidence:
  type: object
  additionalProperties: false
  description: Recorded evidence for an automatic draft decision. The private decision seed is never exposed.
  required: [id, purpose, algorithm_version, normalized_inputs, result, replay_digest, owner_id, decided_at]
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    purpose:
      type: string
      enum: [category, draft_order, pairing, reserve_order, task, wave_order]
      readOnly: true
    algorithm_version:
      type: string
      enum: [hmac-sha256-order-v1]
      readOnly: true
    normalized_inputs:
      type: array
      minItems: 1
      readOnly: true
      items:
        type: string
    result:
      type: array
      minItems: 1
      readOnly: true
      items:
        type: string
    replay_digest:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
      readOnly: true
    owner_id:
      type: string
      format: uuid
      readOnly: true
    decided_at:
      type: string
      format: date-time
      readOnly: true

Draft:
  type: object
  required: [id, series_id, revision, format, first_participant_id, second_participant_id, pool, state, turn, current_actor_id, current_action, turn_deadline, legal_categories, actions, selected_categories]
  properties:
    id:
      type: string
      format: uuid
    series_id:
      type: string
      format: uuid
    revision:
      type: integer
      format: int64
      minimum: 1
    format:
      $ref: '#/SeriesFormat'
    first_participant_id:
      type: string
      format: uuid
    second_participant_id:
      type: string
      format: uuid
    pool:
      type: array
      minItems: 3
      maxItems: 5
      uniqueItems: true
      items:
        $ref: '#/Category'
    state:
      $ref: '#/DraftState'
    turn:
      type: integer
      format: int32
      minimum: 1
      readOnly: true
    current_actor_id:
      type: string
      format: uuid
      nullable: true
      description: Server-authoritative participant allowed to act on the current turn. Null for terminal states.
      readOnly: true
    current_action:
      type: string
      nullable: true
      description: Server-authoritative action required on the current turn. Null for terminal states.
      readOnly: true
      allOf:
        - $ref: '#/DraftActionType'
    turn_deadline:
      type: string
      format: date-time
      nullable: true
      description: Server-authoritative deadline for the current turn. Null when no turn is actionable.
      readOnly: true
    legal_categories:
      type: array
      maxItems: 5
      uniqueItems: true
      description: Categories still legal for the server-authoritative current turn. Empty when no action is actionable.
      readOnly: true
      items:
        $ref: '#/Category'
    actions:
      type: array
      maxItems: 4
      items:
        $ref: '#/DraftAction'
    selected_categories:
      type: array
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/Category'

BO1DraftConstraints:
  type: object
  required: [format, pool, actions, selected_categories]
  properties:
    format:
      type: string
      enum: [bo1]
    pool:
      type: array
      minItems: 3
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/Category'
    actions:
      type: array
      minItems: 2
      maxItems: 2
      items:
        $ref: '#/DraftAction'
    selected_categories:
      type: array
      minItems: 1
      maxItems: 1
      uniqueItems: true
      items:
        $ref: '#/Category'

BO3DraftConstraints:
  type: object
  required: [format, pool, actions, selected_categories]
  properties:
    format:
      type: string
      enum: [bo3]
    pool:
      type: array
      minItems: 5
      maxItems: 5
      uniqueItems: true
      items:
        $ref: '#/Category'
    actions:
      type: array
      minItems: 4
      maxItems: 4
      items:
        $ref: '#/DraftAction'
    selected_categories:
      type: array
      minItems: 3
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/Category'

ParticipantDraftActionRequest:
  type: object
  additionalProperties: false
  required: [expected_projection_revision, expected_draft_revision, expected_turn, action, category]
  properties:
    expected_projection_revision:
      type: integer
      format: int64
      minimum: 1
    expected_draft_revision:
      type: integer
      format: int64
      minimum: 1
    expected_turn:
      type: integer
      format: int32
      minimum: 1
    action:
      $ref: '#/DraftActionType'
    category:
      $ref: '#/Category'

PublicDraftAction:
  type: object
  additionalProperties: false
  required: [turn, actor_display_name, action, category, occurred_at]
  properties:
    turn:
      type: integer
      format: int32
      minimum: 1
    actor_display_name:
      type: string
      maxLength: 64
    action:
      $ref: '#/DraftActionType'
    category:
      $ref: '#/Category'
    occurred_at:
      type: string
      format: date-time

PublicLiveDraftResponse:
  type: object
  additionalProperties: false
  required: [tournament_id, series_id, projection_revision, format, state, pool, actions, selected_categories]
  properties:
    tournament_id:
      type: string
      format: uuid
    series_id:
      type: string
      format: uuid
    projection_revision:
      type: integer
      format: int64
      minimum: 1
    format:
      $ref: '#/SeriesFormat'
    state:
      $ref: '#/DraftState'
    pool:
      type: array
      maxItems: 5
      items:
        $ref: '#/Category'
    actions:
      type: array
      maxItems: 4
      items:
        $ref: '#/PublicDraftAction'
    selected_categories:
      type: array
      maxItems: 3
      items:
        $ref: '#/Category'
