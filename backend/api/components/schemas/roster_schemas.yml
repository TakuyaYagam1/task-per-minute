AttendanceState:
  type: string
  enum: [invited, registered, checked_in, withdrawn]

Roster:
  type: object
  description: Full tournament roster. Execution can start only while locked, and a started roster cannot be unlocked.
  required: [id, tournament_id, revision, participants, locked, execution_started, created_at, updated_at]
  properties:
    id:
      type: string
      format: uuid
    tournament_id:
      type: string
      format: uuid
    revision:
      type: integer
      format: int64
      minimum: 1
      readOnly: true
    participants:
      type: array
      maxItems: 16
      items:
        $ref: '#/Participant'
    locked:
      type: boolean
      readOnly: true
    execution_started:
      type: boolean
      description: True only when locked is also true.
      readOnly: true
    locked_at:
      type: string
      format: date-time
      nullable: true
      readOnly: true
    execution_started_at:
      type: string
      format: date-time
      nullable: true
      readOnly: true
    created_at:
      type: string
      format: date-time
      readOnly: true
    updated_at:
      type: string
      format: date-time
      readOnly: true

AttendanceChangeRequest:
  type: object
  required: [expected_attendance, next_attendance]
  properties:
    expected_attendance:
      $ref: '#/AttendanceState'
    next_attendance:
      $ref: '#/AttendanceState'

RosterLockRequest:
  type: object
  required: [expected_revision, preflight_revision_id, checked_in_player_ids]
  properties:
    expected_revision:
      type: integer
      format: int64
      minimum: 1
    preflight_revision_id:
      type: string
      format: uuid
    checked_in_player_ids:
      type: array
      minItems: 4
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        format: uuid

RosterUnlockRequest:
  type: object
  required: [expected_revision, actor_id, reason]
  properties:
    expected_revision:
      type: integer
      format: int64
      minimum: 1
    actor_id:
      type: string
      format: uuid
    reason:
      type: string
      minLength: 1
      maxLength: 512

PreflightCode:
  type: string
  enum:
    - tournament.preflight.structure.roster_complete
    - tournament.preflight.structure.attendance
    - tournament.preflight.structure.participant_exclusive
    - tournament.preflight.structure.preset
    - tournament.preflight.structure.categories
    - tournament.preflight.structure.pairings
    - tournament.preflight.structure.byes
    - tournament.preflight.structure.overrides
    - tournament.preflight.tasks.pool_configuration
    - tournament.preflight.tasks.inventory
    - tournament.preflight.tasks.missing
    - tournament.preflight.tasks.disabled
    - tournament.preflight.tasks.unhealthy
    - tournament.preflight.tasks.mutable
    - tournament.preflight.tasks.publicly_exposed
    - tournament.preflight.tasks.wrong_pool
    - tournament.preflight.runtime.configuration
    - tournament.preflight.runtime.authoritative_storage
    - tournament.preflight.runtime.submission
    - tournament.preflight.runtime.task_delivery
    - tournament.preflight.runtime.realtime
    - tournament.preflight.runtime.capacity
    - tournament.preflight.runtime.clock
    - tournament.preflight.runtime.dependencies
    - tournament.preflight.runtime.schedule

PreflightCheck:
  type: object
  required: [code, passed, explanation, evidence]
  properties:
    code:
      $ref: '#/PreflightCode'
    passed:
      type: boolean
    explanation:
      type: string
    evidence:
      type: array
      items:
        type: string

PreflightSourceRevision:
  type: object
  required: [source, value]
  properties:
    source:
      type: string
    value:
      type: string

PreflightReport:
  type: object
  description: Immutable preflight result used as roster-lock evidence.
  required: [id, tournament_id, algorithm_version, evaluated_at, normalized_inputs, revisions, proof_hash, checks, passed]
  properties:
    id:
      type: string
      format: uuid
      readOnly: true
    tournament_id:
      type: string
      format: uuid
      readOnly: true
    algorithm_version:
      type: string
      enum: [tournament-preflight-report-v1]
      readOnly: true
    evaluated_at:
      type: string
      format: date-time
      readOnly: true
    normalized_inputs:
      type: array
      readOnly: true
      items:
        type: string
    revisions:
      type: array
      minItems: 1
      readOnly: true
      items:
        $ref: '#/PreflightSourceRevision'
    proof_hash:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-f]{64}$'
      readOnly: true
    checks:
      type: array
      minItems: 1
      readOnly: true
      items:
        $ref: '#/PreflightCheck'
    passed:
      type: boolean
      readOnly: true

RosterParticipantInput:
  type: object
  additionalProperties: false
  required: [player_id, seed, attendance]
  properties:
    player_id:
      type: string
      format: uuid
    seed:
      type: integer
      format: int32
      minimum: 1
      maximum: 16
    attendance:
      $ref: '#/AttendanceState'

ReplaceRosterRequest:
  type: object
  additionalProperties: false
  required: [expected_projection_revision, participants]
  properties:
    expected_projection_revision:
      type: integer
      format: int64
      minimum: 1
    participants:
      type: array
      minItems: 4
      maxItems: 16
      items:
        $ref: '#/RosterParticipantInput'

PreflightRequest:
  type: object
  additionalProperties: false
  required: [expected_projection_revision]
  properties:
    expected_projection_revision:
      type: integer
      format: int64
      minimum: 1

LockRosterRequest:
  type: object
  additionalProperties: false
  required: [expected_projection_revision, preflight_revision_id, checked_in_player_ids]
  properties:
    expected_projection_revision:
      type: integer
      format: int64
      minimum: 1
    preflight_revision_id:
      type: string
      format: uuid
    checked_in_player_ids:
      type: array
      minItems: 4
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        format: uuid

UnlockRosterRequest:
  type: object
  additionalProperties: false
  required: [expected_projection_revision, confirmed, reason]
  properties:
    expected_projection_revision:
      type: integer
      format: int64
      minimum: 1
    confirmed:
      type: boolean
    reason:
      type: string
      minLength: 1
      maxLength: 512
