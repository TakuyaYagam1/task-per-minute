ProblemDetails:
  type: object
  description: RFC 7807 error envelope used by REST validation and operation errors.
  required: [type, title, status]
  properties:
    type:
      type: string
      format: uri
      example: "about:blank"
    title:
      type: string
      example: "Validation Failed"
    status:
      type: integer
      format: int32
      minimum: 400
      maximum: 599
      example: 400
    code:
      type: string
      description: Stable application error code for clients that need to handle a specific failure.
      example: player.email_unverified
    detail:
      type: string
      example: "username must be 2..50 characters"
    instance:
      type: string
      example: "/api/v1/players/join"
    request_id:
      type: string
      example: "01HXC2K9F4ZG6YV1AAB7TBQ7AP"

DependencyStatus:
  type: object
  description: Independent operating health and traffic readiness for one tournament dependency.
  required: [health, readiness]
  properties:
    health:
      type: string
      enum: [healthy, degraded, failed]
      x-enum-varnames:
        - DependencyStatusHealthHealthy
        - DependencyStatusHealthDegraded
        - DependencyStatusHealthFailed
    readiness:
      type: string
      enum: [ready, not_ready, stale]
      x-enum-varnames:
        - DependencyStatusReadinessReady
        - DependencyStatusReadinessNotReady
        - DependencyStatusReadinessStale

HealthResponse:
  type: object
  required:
    - status
    - db
    - redis
    - seaweedfs
    - schema_version
    - tournament_authority
    - tournament_submission
    - tournament_task_delivery
    - tournament_outbox
    - tournament_realtime
    - tournament_projection
    - tournament_clock
    - tournament_recovery
  properties:
    status:
      type: string
      enum: [ok, degraded]
      x-enum-varnames: [HealthResponseStatusOk, HealthResponseStatusDegraded]
    db:
      type: string
      enum: [ok, error]
      x-enum-varnames: [HealthResponseDbOk, HealthResponseDbError]
    redis:
      type: string
      enum: [ok, error]
      x-enum-varnames: [HealthResponseRedisOk, HealthResponseRedisError]
    seaweedfs:
      type: string
      enum: [ok, error]
      x-enum-varnames: [HealthResponseSeaweedfsOk, HealthResponseSeaweedfsError]
    schema_version:
      type: integer
      format: int64
      minimum: 0
    tournament_authority:
      $ref: '#/DependencyStatus'
    tournament_submission:
      $ref: '#/DependencyStatus'
    tournament_task_delivery:
      $ref: '#/DependencyStatus'
    tournament_outbox:
      $ref: '#/DependencyStatus'
    tournament_realtime:
      $ref: '#/DependencyStatus'
    tournament_projection:
      $ref: '#/DependencyStatus'
    tournament_clock:
      $ref: '#/DependencyStatus'
    tournament_recovery:
      $ref: '#/DependencyStatus'
