ProblemDetails:
  type: object
  description: RFC 7807 error envelope used by every 4xx/5xx response.
  required: [type, title, status]
  properties:
    type:
      type: string
      format: uri
      example: "about:blank"
    title:
      type: string
      example: "Validation Failed"
    status:
      type: integer
      format: int32
      minimum: 400
      maximum: 599
      example: 400
    detail:
      type: string
      example: "username must be 2..50 characters"
    instance:
      type: string
      example: "/api/v1/players/join"
    request_id:
      type: string
      example: "01HXC2K9F4ZG6YV1AAB7TBQ7AP"

ArenaDependencyStatus:
  type: object
  description: Independent operating health and traffic readiness for one Arena dependency.
  required: [health, readiness]
  properties:
    health:
      type: string
      enum: [healthy, degraded, failed]
    readiness:
      type: string
      enum: [ready, not_ready, stale]

HealthResponse:
  type: object
  required:
    - status
    - db
    - redis
    - seaweedfs
    - schema_version
    - arena_authority
    - arena_submission
    - arena_task_delivery
    - arena_outbox
    - arena_realtime
    - arena_clock
    - arena_recovery
  properties:
    status:
      type: string
      enum: [ok, degraded]
    db:
      type: string
      enum: [ok, error]
    redis:
      type: string
      enum: [ok, error]
    seaweedfs:
      type: string
      enum: [ok, error]
    schema_version:
      type: integer
      format: int64
      minimum: 0
    arena_authority:
      $ref: '#/ArenaDependencyStatus'
    arena_submission:
      $ref: '#/ArenaDependencyStatus'
    arena_task_delivery:
      $ref: '#/ArenaDependencyStatus'
    arena_outbox:
      $ref: '#/ArenaDependencyStatus'
    arena_realtime:
      $ref: '#/ArenaDependencyStatus'
    arena_clock:
      $ref: '#/ArenaDependencyStatus'
    arena_recovery:
      $ref: '#/ArenaDependencyStatus'
