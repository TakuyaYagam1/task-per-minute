PlayerResponse:
  type: object
  required: [id, username, created_at]
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
      minLength: 2
      maxLength: 50
    created_at:
      type: string
      format: date-time

JoinPlayerRequest:
  type: object
  additionalProperties: false
  required: [username]
  properties:
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
      example: "takuya"

JoinPlayerResponse:
  type: object
  required: [player_id]
  properties:
    player_id:
      type: string
      format: uuid

CurrentPlayerResponse:
  type: object
  required: [player]
  properties:
    player:
      $ref: '#/PlayerResponse'

PlayerAuditAction:
  type: string
  enum: [update, delete]
  x-enum-varnames: [PlayerAuditActionUpdate, PlayerAuditActionDelete]

PlayerAuditState:
  type: object
  required: [username, wins, average_solve_time_ms, stats_overridden, deleted]
  properties:
    username:
      type: string
    wins:
      type: integer
      format: int32
      minimum: 0
    average_solve_time_ms:
      type: integer
      format: int64
      minimum: 0
    stats_overridden:
      type: boolean
    deleted:
      type: boolean

PlayerAuditEvent:
  type: object
  required: [id, actor_subject, actor_jti, action, player_id, before_state, after_state, created_at]
  properties:
    id:
      type: string
      format: uuid
    actor_subject:
      type: string
    actor_jti:
      type: string
    action:
      $ref: '#/PlayerAuditAction'
    player_id:
      type: string
      format: uuid
    before_state:
      $ref: '#/PlayerAuditState'
    after_state:
      $ref: '#/PlayerAuditState'
    created_at:
      type: string
      format: date-time

PlayerManagementView:
  type: object
  required: [id, username, created_at, wins, average_solve_time_ms, stats_overridden]
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
    created_at:
      type: string
      format: date-time
    deleted_at:
      type: string
      format: date-time
      nullable: true
    wins:
      type: integer
      format: int32
      minimum: 0
    average_solve_time_ms:
      type: integer
      format: int64
      minimum: 0
    stats_overridden:
      type: boolean

UpdatePlayerRequest:
  type: object
  additionalProperties: false
  required: [username, wins, average_solve_time_ms]
  properties:
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
    wins:
      type: integer
      format: int32
      minimum: 0
    average_solve_time_ms:
      type: integer
      format: int64
      minimum: 0
