PlayerResponse:
  type: object
  required: [id, username, created_at]
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
      minLength: 2
      maxLength: 50
    created_at:
      type: string
      format: date-time

JoinPlayerRequest:
  type: object
  additionalProperties: false
  required: [username]
  properties:
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
      example: "takuya"

PlayerRegistrationRequest:
  type: object
  additionalProperties: false
  required: [username, email, password]
  properties:
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
      example: "takuya"
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      description: A bare ASCII dot-atom mailbox with a 1-64 character local part and at least two ASCII DNS labels. Each label is 1-63 characters with alphanumeric edges and optional internal hyphens. The final label must be at least two ASCII letters or begin with xn--.
    password:
      type: string
      format: password
      writeOnly: true
      minLength: 10
      maxLength: 128
      description: Must contain at least one Unicode lowercase letter, uppercase letter, decimal digit, and punctuation or symbol. Whitespace alone does not satisfy the punctuation or symbol requirement.

PlayerLoginRequest:
  type: object
  additionalProperties: false
  required: [login, password]
  properties:
    login:
      type: string
      minLength: 1
      maxLength: 254
      description: Case-insensitive player username or email address.
    password:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      maxLength: 128

PlayerVerificationRequest:
  type: object
  additionalProperties: false
  required: [token]
  properties:
    token:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'

PlayerResendVerificationRequest:
  type: object
  additionalProperties: false
  required: [email]
  properties:
    email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      description: A bare ASCII dot-atom mailbox with a 1-64 character local part and at least two ASCII DNS labels. Each label is 1-63 characters with alphanumeric edges and optional internal hyphens. The final label must be at least two ASCII letters or begin with xn--.

PlayerAccountAcceptedResponse:
  type: object
  required: [accepted]
  properties:
    accepted:
      type: boolean
      enum: [true]

PlayerAccountSettingsResponse:
  type: object
  additionalProperties: false
  required: [username, email, pending_email, pending_email_expires_at, email_resend_available_at]
  properties:
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
    email:
      type: string
      format: email
      maxLength: 254
    pending_email:
      type: string
      format: email
      maxLength: 254
      nullable: true
    pending_email_expires_at:
      type: string
      format: date-time
      nullable: true
    email_resend_available_at:
      type: string
      format: date-time
      nullable: true

PlayerAccountUsernameRequest:
  type: object
  additionalProperties: false
  required: [current_password, username]
  properties:
    current_password:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      maxLength: 128
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'

PlayerAccountPasswordRequest:
  type: object
  additionalProperties: false
  required: [current_password, new_password]
  properties:
    current_password:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      maxLength: 128
    new_password:
      type: string
      format: password
      writeOnly: true
      minLength: 10
      maxLength: 128
      description: Must contain at least one Unicode lowercase letter, uppercase letter, decimal digit, and punctuation or symbol. Whitespace alone does not satisfy the punctuation or symbol requirement.

PlayerAccountEmailChangeRequest:
  type: object
  additionalProperties: false
  required: [current_password, new_email]
  properties:
    current_password:
      type: string
      format: password
      writeOnly: true
      minLength: 1
      maxLength: 128
    new_email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      description: A bare ASCII dot-atom mailbox with a 1-64 character local part and at least two ASCII DNS labels. Each label is 1-63 characters with alphanumeric edges and optional internal hyphens. The final label must be at least two ASCII letters or begin with xn--.

PlayerAccountEmailChangeConfirmRequest:
  type: object
  additionalProperties: false
  required: [code]
  properties:
    code:
      type: string
      minLength: 6
      maxLength: 6
      pattern: '^[0-9]{6}$'

PlayerAccountEmailChangeConfirmedResponse:
  type: object
  additionalProperties: false
  required: [email, previous_email_notified]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    previous_email_notified:
      type: boolean

CreatePlayerRequest:
  type: object
  additionalProperties: false
  required: [username]
  properties:
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
      example: "takuya"

JoinPlayerResponse:
  type: object
  required: [player_id]
  properties:
    player_id:
      type: string
      format: uuid

CurrentPlayerResponse:
  type: object
  required: [player]
  properties:
    player:
      $ref: '#/PlayerResponse'

PlayerAuditAction:
  type: string
  enum: [update, delete]
  x-enum-varnames: [PlayerAuditActionUpdate, PlayerAuditActionDelete]

PlayerAuditState:
  type: object
  required: [username, wins, average_solve_time_ms, stats_overridden, deleted]
  properties:
    username:
      type: string
    wins:
      type: integer
      format: int32
      minimum: 0
    average_solve_time_ms:
      type: integer
      format: int64
      minimum: 0
    stats_overridden:
      type: boolean
    deleted:
      type: boolean

PlayerAuditEvent:
  type: object
  required: [id, actor_subject, actor_jti, action, player_id, before_state, after_state, created_at]
  properties:
    id:
      type: string
      format: uuid
    actor_subject:
      type: string
    actor_jti:
      type: string
    action:
      $ref: '#/PlayerAuditAction'
    player_id:
      type: string
      format: uuid
    before_state:
      $ref: '#/PlayerAuditState'
    after_state:
      $ref: '#/PlayerAuditState'
    created_at:
      type: string
      format: date-time

PlayerManagementView:
  type: object
  required: [id, username, created_at, wins, average_solve_time_ms, stats_overridden]
  properties:
    id:
      type: string
      format: uuid
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
    created_at:
      type: string
      format: date-time
    deleted_at:
      type: string
      format: date-time
      nullable: true
    wins:
      type: integer
      format: int32
      minimum: 0
    average_solve_time_ms:
      type: integer
      format: int64
      minimum: 0
    stats_overridden:
      type: boolean

UpdatePlayerRequest:
  type: object
  additionalProperties: false
  required: [username, wins, average_solve_time_ms]
  properties:
    username:
      type: string
      minLength: 2
      maxLength: 50
      pattern: '^[a-zA-Z0-9_-]+$'
    wins:
      type: integer
      format: int32
      minimum: 0
    average_solve_time_ms:
      type: integer
      format: int64
      minimum: 0
