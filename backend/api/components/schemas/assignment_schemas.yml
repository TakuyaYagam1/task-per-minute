TaskSnapshot:
  type: object
  description: Public immutable task snapshot. Private flag material and undisclosed reserves are excluded.
  required: [snapshot_id, task_id, version, kind, title, description, category, difficulty, time_limit, hints]
  properties:
    snapshot_id:
      type: string
      format: uuid
    task_id:
      type: string
      format: uuid
    version:
      type: integer
      format: int32
      minimum: 1
    kind:
      $ref: '#/TaskKind'
    title:
      type: string
    description:
      type: string
    category:
      $ref: '#/Category'
    difficulty:
      $ref: '#/Difficulty'
    time_limit:
      type: integer
      format: int32
      minimum: 1
    hints:
      type: array
      items:
        type: string
    task_url:
      type: string
      nullable: true
    source_file_url:
      type: string
      format: uri
      nullable: true

ParticipantTaskSnapshot:
  type: object
  description: Participant-safe immutable task snapshot. Internal archive locations, flag material, and undisclosed reserves are excluded.
  additionalProperties: false
  required: [snapshot_id, task_id, version, kind, title, description, category, difficulty, time_limit, hints, source_file_available]
  properties:
    snapshot_id:
      type: string
      format: uuid
    task_id:
      type: string
      format: uuid
    version:
      type: integer
      format: int32
      minimum: 1
    kind:
      $ref: '#/TaskKind'
    title:
      type: string
    description:
      type: string
    category:
      $ref: '#/Category'
    difficulty:
      $ref: '#/Difficulty'
    time_limit:
      type: integer
      format: int32
      minimum: 1
    hints:
      type: array
      items:
        type: string
    task_url:
      type: string
      nullable: true
    source_file_available:
      type: boolean
      description: Whether the immutable snapshot has a source archive available through the participant download endpoint.

DeliveryReceipt:
  type: object
  required: [id, assignment_id, attempt_id, participant_id, snapshot_id, task_id, delivered_at]
  properties:
    id:
      type: string
      format: uuid
    assignment_id:
      type: string
      format: uuid
    attempt_id:
      type: string
      format: uuid
    participant_id:
      type: string
      format: uuid
    snapshot_id:
      type: string
      format: uuid
    task_id:
      type: string
      format: uuid
    delivered_at:
      type: string
      format: date-time
      readOnly: true

Assignment:
  type: object
  required: [id, attempt_id, participant_ids, active_snapshot, undisclosed_reserve_count, receipts]
  properties:
    id:
      type: string
      format: uuid
    attempt_id:
      type: string
      format: uuid
    participant_ids:
      type: array
      minItems: 2
      maxItems: 2
      uniqueItems: true
      items:
        type: string
        format: uuid
    active_snapshot:
      $ref: '#/TaskSnapshot'
    undisclosed_reserve_count:
      type: integer
      format: int32
      minimum: 0
      maximum: 2
    receipts:
      type: array
      items:
        $ref: '#/DeliveryReceipt'

OperatorReserveRequest:
