    - old_wave_id
    - series_id
    - slot_id
    - assignment_id
    - assignment_attempt_id
    - confirmed
    - reason
    - expected_authority_revision
    - expected_exhaustion_command_id
    - expected_assignment_revision
    - expected_pool_revision_id
    - expected_pool_revision
    - expected_history_revision_id
    - expected_history_revision
    - expected_artifact_revision_id
    - expected_artifact_revision
    - expected_reservation_revision_id
    - expected_reservation_revision
    - expected_category_revision_id
    - expected_category_revision
    - proposed_task_id
    - proposed_version
    - proposed_snapshot_id
    - expected_snapshot_id
    - evidence_id
  properties:
    tournament_id:
      type: string
      format: uuid
    old_wave_id:
      type: string
      format: uuid
    series_id:
      type: string
      format: uuid
    slot_id:
      type: string
      format: uuid
    assignment_id:
      type: string
      format: uuid
    assignment_attempt_id:
      type: string
      format: uuid
    confirmed:
      type: boolean
    reason:
      type: string
      minLength: 1
      maxLength: 512
    expected_authority_revision:
      type: integer
      format: int64
      minimum: 1
    expected_exhaustion_command_id:
      type: string
      format: uuid
    expected_assignment_revision:
      type: integer
      format: int64
      minimum: 1
    expected_pool_revision_id:
      type: string
      format: uuid
    expected_pool_revision:
      type: integer
      format: int64
      minimum: 1
    expected_history_revision_id:
      type: string
      format: uuid
    expected_history_revision:
      type: integer
      format: int64
      minimum: 1
    expected_artifact_revision_id:
      type: string
      format: uuid
    expected_artifact_revision:
      type: integer
      format: int64
      minimum: 1
    expected_reservation_revision_id:
      type: string
      format: uuid
    expected_reservation_revision:
      type: integer
      format: int64
      minimum: 1
    expected_category_revision_id:
      type: string
      format: uuid
    expected_category_revision:
      type: integer
      format: int64
      minimum: 1
    proposed_task_id:
      type: string
      format: uuid
    proposed_version:
      type: integer
      format: int32
      minimum: 1
    proposed_snapshot_id:
      type: string
      format: uuid
    expected_snapshot_id:
      type: string
      format: uuid
    evidence_id:
      type: string
      format: uuid

ParticipantAssignmentResponse:
  type: object
  additionalProperties: false
  required: [tournament_id, projection_revision, assignment]
  properties:
    tournament_id:
      type: string
      format: uuid
    projection_revision:
      type: integer
      format: int64
      minimum: 1
    assignment:
      $ref: '#/ParticipantAssignment'

ParticipantSourceFileResponse:
  type: object
  additionalProperties: false
  required: [source_file_url, expires_at]
  properties:
    source_file_url:
      type: string
      format: uri
      description: Fresh temporary URL signed against the configured public storage origin.
    expires_at:
      type: string
      format: date-time
      readOnly: true

ParticipantAssignment:
  type: object
  additionalProperties: false
  required: [id, attempt_id, active_snapshot, undisclosed_reserve_count, receipt]
  properties:
    id:
      type: string
      format: uuid
    attempt_id:
      type: string
      format: uuid
    active_snapshot:
      $ref: '#/ParticipantTaskSnapshot'
    undisclosed_reserve_count:
      type: integer
      format: int32
      minimum: 0
      maximum: 2
    receipt:
      $ref: '#/DeliveryReceipt'
