AdminSessionAuth:
  type: apiKey
  in: cookie
  name: tpm_admin_access
  description: >
    HttpOnly admin access session cookie issued by POST /api/v1/admin/login or
    POST /api/v1/admin/refresh. Unsafe admin requests must also send the CSRF
    token in X-CSRF-Token. Refresh and logout use the CSRF token bound to the
    tpm_admin_refresh cookie in the same header.

AdminRefreshSessionAuth:
  type: apiKey
  in: cookie
  name: tpm_admin_refresh
  description: >
    HttpOnly admin refresh session cookie issued by POST /api/v1/admin/login or
    POST /api/v1/admin/refresh. Refresh and logout requests must also send the
    cookie-bound CSRF token in X-CSRF-Token.

PlayerSessionAuth:
  type: apiKey
  in: cookie
  name: tpm_player_session
  description: >
    HttpOnly opaque UUID session cookie issued by POST /api/v1/players/join.
    Unsafe authenticated player REST requests must also send X-CSRF-Token
    matching the readable tpm_player_csrf cookie. The CSRF token is signed and
    bound to the HttpOnly player session cookie. The same token is exposed in
    X-CSRF-Token response headers for split-domain browser apps.
