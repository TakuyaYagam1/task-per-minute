name: reusable frontend verify

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.1
  PYTHON_VERSION: '3.13'
  FRONTEND_WORKDIR: frontend

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: configure temporary paths
        run: |
          set -euo pipefail
          printf 'FRONTEND_CI_REPORT_DIR=%s/frontend-verify\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: initialize verification evidence
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node scripts/verify-frontend-ci.mjs --init

      - name: setup go for OpenAPI generation
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: configure reviewed frontend runtime
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node scripts/configure-ci-runtime.mjs

      - name: install openapi generator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: test frontend runtime validation
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node --test scripts/configure-ci-runtime.test.mjs scripts/run-e2e.test.mjs

      - name: install frontend dependencies
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: npm ci --ignore-scripts --userconfig config/npm-empty-userconfig

      - name: verify installed Playwright runtime
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node scripts/configure-ci-runtime.mjs --verify-packages

      - name: install Playwright Chromium
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node node_modules/playwright/cli.js install --with-deps chromium

      # NOTE: The unpatched ESLint transitive braces advisory is temporarily accepted
      # in frontend/config/npm-audit-exceptions.json until 2026-10-18. Other findings block CI.
      - name: dependency advisory gate
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        env:
          NPM_AUDIT_REPORT: ${{ env.FRONTEND_CI_REPORT_DIR }}/dependency-audit.json
        run: npm run audit:dependencies

      - name: frontend verification
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        env:
          E2E_WORKERS: 1
          E2E_SUMMARY_FILE: ${{ env.FRONTEND_CI_REPORT_DIR }}/e2e-summary.json
        run: npm run verify:ci

      - name: finalize verification evidence
        if: ${{ always() }}
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        env:
          FRONTEND_CI_ERROR: frontend verification job did not complete successfully
        run: node scripts/verify-frontend-ci.mjs --finalize

      - name: upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-verify-${{ inputs.target_sha }}
          path: ${{ env.FRONTEND_CI_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14

  full-stack-e2e:
    name: full-stack e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: configure reviewed frontend runtime
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node scripts/configure-ci-runtime.mjs

      - name: install frontend dependencies
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: npm ci --ignore-scripts --userconfig config/npm-empty-userconfig

      - name: verify installed Playwright runtime
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node scripts/configure-ci-runtime.mjs --verify-packages

      - name: install Playwright Chromium
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: validate disposable Compose configuration
        working-directory: ${{ env.FRONTEND_WORKDIR }}
        run: node --test scripts/e2e-compose-config.test.mjs

      - name: write disposable e2e env
        env:
          FULL_STACK_ENV_FILE: ${{ runner.temp }}/task-per-minute-e2e.env
        run: |
          set -Eeuo pipefail
          umask 077
          cat > "$FULL_STACK_ENV_FILE" <<'ENV'
          BACKEND_PORT=18080
          FRONTEND_PORT=3100
          POSTGRES_PORT=15432
          REDIS_PORT=16379
          SEAWEEDFS_MASTER_PORT=19333
          SEAWEEDFS_S3_PORT=18333
          POSTGRES_USER=tpm_ci
          POSTGRES_PASSWORD=tpm_ci_password
          POSTGRES_DB=task_per_minute
          HTTP_PORT=8080
          HTTP_HOST=0.0.0.0
          HTTP_ALLOWED_ORIGINS=http://127.0.0.1:3100,http://localhost:3100
          HTTP_TRUSTED_PROXY_CIDRS=172.30.0.0/24
          DB_DSN=postgres://tpm_ci:tpm_ci_password@postgres:5432/task_per_minute?sslmode=disable
          DB_MAX_CONNS=20
          REDIS_ADDR=redis:6379
          REDIS_PASSWORD=tpm_ci_redis_password
          REDIS_DB=0
          SEAWEEDFS_ENDPOINT=seaweedfs:8333
          SEAWEEDFS_PUBLIC_ENDPOINT=127.0.0.1:18333
          SEAWEEDFS_ACCESS_KEY=tpm_ci_access
          SEAWEEDFS_SECRET_KEY=tpm_ci_secret
          SEAWEEDFS_BUCKET=task-per-minute
          SEAWEEDFS_SECURE=false
          SEAWEEDFS_PUBLIC_SECURE=false
          JWT_SECRET=tpm-ci-jwt-secret-with-at-least-32-chars
          JWT_ACCESS_TTL=15m
          JWT_REFRESH_TTL=168h
          INCIDENT_EXPORT_HMAC_KEY_ID=ci-e2e
          ADMIN_PASSWORD=tpm-ci-admin-password
          ADMIN_LOGIN_RATE_ATTEMPTS=10
          ADMIN_LOGIN_RATE_WINDOW=3m
          ADMIN_LOGIN_RATE_BUCKET_TTL=15m
          ADMIN_REFRESH_RATE_ATTEMPTS=20
          ADMIN_REFRESH_RATE_WINDOW=3m
          ADMIN_REFRESH_RATE_BUCKET_TTL=15m
          PLAYER_JOIN_RATE_ATTEMPTS=100
          PLAYER_JOIN_RATE_WINDOW=5m
          PLAYER_JOIN_RATE_BUCKET_TTL=1h
          PLAYER_SESSION_TTL=1h
          WS_ALLOWED_ORIGINS=http://127.0.0.1:3100,http://localhost:3100
          WS_REQUIRE_ORIGIN=true
          WS_HANDSHAKE_RATE_ATTEMPTS=200
          WS_HANDSHAKE_RATE_WINDOW=1m
          WS_HANDSHAKE_RATE_BUCKET_TTL=15m
          WS_MESSAGE_RATE_ATTEMPTS=240
          WS_MESSAGE_RATE_WINDOW=1m
          WS_ACTION_RATE_ATTEMPTS=120
          WS_ACTION_RATE_WINDOW=1m
          NEXT_PUBLIC_API_URL=
          NEXT_PUBLIC_ADMIN_API_URL=
          ENV
          # Each disposable stack gets its own signing key.
          node -e 'const fs = require("node:fs"); const { randomBytes } = require("node:crypto"); fs.appendFileSync(process.env.FULL_STACK_ENV_FILE, "INCIDENT_EXPORT_HMAC_SECRET=" + randomBytes(32).toString("hex") + "\n");'

      - name: full-stack e2e
        env:
          E2E_SUMMARY_FILE: ${{ runner.temp }}/frontend-full-stack/e2e-summary.json
          E2E_ADMIN_PASSWORD: tpm-ci-admin-password
          E2E_COMPOSE_ENV_FILE: ${{ runner.temp }}/task-per-minute-e2e.env
          E2E_COMPOSE_REPORT_FILE: ${{ runner.temp }}/frontend-full-stack/full-stack-verify.json
          E2E_COMPOSE_SYNTHETIC: '1'
          E2E_COMPOSE_CLEAN: '0'
          E2E_COMPOSE_PROJECT_NAME: task-per-minute-ci-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_FRONTEND_PORT: '3100'
          E2E_BACKEND_PORT: '18080'
          E2E_POSTGRES_PORT: '15432'
          E2E_REDIS_PORT: '16379'
          E2E_SEAWEEDFS_MASTER_PORT: '19333'
          E2E_SEAWEEDFS_S3_PORT: '18333'
        run: bash scripts/e2e-local-compose.sh

      - name: upload full-stack evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-full-stack-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/frontend-full-stack
          if-no-files-found: error
          retention-days: 14
