name: reusable build images

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      backend_image_ref:
        required: true
        type: string
      frontend_image_ref:
        required: true
        type: string
    outputs:
      backend_digest:
        description: Backend image digest from the backend build.
        value: ${{ jobs.backend-image.outputs.digest }}
      frontend_digest:
        description: Verified frontend OCI index digest.
        value: ${{ jobs.frontend-image.outputs.digest }}
      frontend_source_revision:
        description: Source revision verified against the frontend provenance.
        value: ${{ jobs.frontend-image.outputs.source_revision }}

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: 24.21.0
  PYTHON_VERSION: '3.13'
  FRONTEND_WORKDIR: frontend

jobs:
  backend-image:
    name: build backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: validate source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ ${#TARGET_SHA} -ne 40 || ! "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Target revision must be a canonical 40-character lowercase commit SHA" >&2
            exit 1
          fi
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: setup buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: build backend image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: ${{ inputs.backend_image_ref }}

  frontend-image:
    name: build and verify frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
      source_revision: ${{ steps.identity.outputs.source_revision }}
    steps:
      - name: configure temporary paths
        run: |
          set -euo pipefail
          printf 'DOCKER_CONFIG=%s/frontend-docker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: validate source revision
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          if [[ ${#TARGET_SHA} -ne 40 || ! "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Target revision must be a canonical 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: validate public frontend urls
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
          NEXT_PUBLIC_SOURCE_FILE_ORIGINS: ${{ vars.NEXT_PUBLIC_SOURCE_FILE_ORIGINS }}
          HTTP_ALLOWED_ORIGINS: ${{ vars.HTTP_ALLOWED_ORIGINS }}
          WS_ALLOWED_ORIGINS: ${{ vars.WS_ALLOWED_ORIGINS }}
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlparse

          api_url = os.environ.get("NEXT_PUBLIC_API_URL", "").strip()
          admin_api_url = os.environ.get("NEXT_PUBLIC_ADMIN_API_URL", "").strip()
          source_file_origins = os.environ.get("NEXT_PUBLIC_SOURCE_FILE_ORIGINS", "").strip()
          http_allowed = os.environ.get("HTTP_ALLOWED_ORIGINS", "").strip()
          ws_allowed = os.environ.get("WS_ALLOWED_ORIGINS", "").strip()

          def fail(message: str) -> None:
              print(f"::error::{message}")
              sys.exit(1)

          def parse_url(name: str, value: str, schemes: set[str]):
              parsed = urlparse(value)
              if parsed.scheme not in schemes or not parsed.netloc:
                  fail(f"{name} must be an absolute URL with one of: {', '.join(sorted(schemes))}")
              if parsed.username is not None or parsed.password is not None:
                  fail(f"{name} must not include credentials")
              if parsed.params or parsed.query or parsed.fragment:
                  fail(f"{name} must not include params, query, or fragment")
              return parsed

          def origin(parsed) -> str:
              return f"{parsed.scheme}://{parsed.netloc}".rstrip("/")

          def split_origins(value: str) -> set[str]:
              return {
                  item.strip().rstrip("/")
                  for item in value.replace("\n", ",").split(",")
                  if item.strip()
              }

          for value in split_origins(source_file_origins):
              parsed = parse_url("NEXT_PUBLIC_SOURCE_FILE_ORIGINS", value, {"https"})
              if origin(parsed) != value:
                  fail("NEXT_PUBLIC_SOURCE_FILE_ORIGINS entries must be origins without paths")

          if not api_url and not admin_api_url:
              print("Using same-origin frontend mode: NEXT_PUBLIC_* URLs are empty.")
              sys.exit(0)

          if not api_url or not admin_api_url:
              fail("Direct frontend mode requires NEXT_PUBLIC_API_URL and NEXT_PUBLIC_ADMIN_API_URL. Leave both empty for same-origin mode.")

          api = parse_url("NEXT_PUBLIC_API_URL", api_url, {"https"})
          admin_api = parse_url("NEXT_PUBLIC_ADMIN_API_URL", admin_api_url, {"https"})

          if origin(api) != origin(admin_api):
              fail("NEXT_PUBLIC_API_URL and NEXT_PUBLIC_ADMIN_API_URL must use the same backend origin")

          http_origins = split_origins(http_allowed)
          ws_origins = split_origins(ws_allowed)
          if not http_origins or not ws_origins:
              fail("Direct frontend mode requires HTTP_ALLOWED_ORIGINS and WS_ALLOWED_ORIGINS GitHub vars. Leave NEXT_PUBLIC_* empty for same-origin mode.")
          if "*" in http_origins or "*" in ws_origins:
              fail("Direct frontend mode must not use wildcard REST/WS origin allowlists")
          if not ws_origins.issubset(http_origins):
              fail("WS_ALLOWED_ORIGINS must be a subset of HTTP_ALLOWED_ORIGINS for direct browser mode")

          print("Validated direct frontend public URL mode.")
          PY

      - name: setup buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.35.0

      - name: test frontend image evidence
        run: |
          node --test scripts/release/tests/build-frontend-image.test.mjs \
            scripts/release/tests/validate-frontend-image.test.mjs \
            scripts/release/tests/frontend-image-workflow.test.mjs \
            scripts/release/tests/scan-frontend-image.test.mjs \
            scripts/release/tests/check-frontend-runtime.test.mjs \
            scripts/release/tests/verify-frontend-release.test.mjs \
            scripts/release/tests/frontend-publication.test.mjs \
            scripts/release/tests/validate-frontend-rollout.test.mjs \
            scripts/release/tests/frontend-readiness.test.mjs \
            scripts/release/tests/check-frontend-readiness.test.mjs \
            .github/scripts/dependabot-merge.test.mjs

      - name: build frontend OCI artifact
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT || 8080 }}
          BACKEND_URL: ${{ vars.FRONTEND_BACKEND_URL || format('http://backend:{0}', vars.BACKEND_PORT || 8080) }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT || 3000 }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
          NEXT_PUBLIC_SOURCE_FILE_ORIGINS: ${{ vars.NEXT_PUBLIC_SOURCE_FILE_ORIGINS }}
        run: >-
          node scripts/release/build-frontend-image.mjs
          --output "$RUNNER_TEMP/frontend-image"
          --revision "$TARGET_SHA"

      - name: prepare frontend vulnerability scanner
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/frontend-scanner"
          curl --disable --fail --location --proto '=https' --tlsv1.2 --max-time 120 --retry 2 --silent --show-error \
            --output "$RUNNER_TEMP/frontend-scanner/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          printf '%s  %s\n' bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea "$RUNNER_TEMP/frontend-scanner/trivy.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/frontend-scanner/trivy.tar.gz" \
            --directory "$RUNNER_TEMP/frontend-scanner" --no-same-owner --no-same-permissions --keep-old-files trivy
          printf '%s  %s\n' 0e69edd134a3c338baa1a6806920773615d682b18cbc6a0cba2a3b658ef9b63e "$RUNNER_TEMP/frontend-scanner/trivy" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/frontend-scanner/trivy"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/frontend-scanner" \
            "$RUNNER_TEMP/frontend-scanner/trivy" image --config /dev/null \
            --cache-dir "$RUNNER_TEMP/frontend-scanner/cache" \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 --download-db-only \
            --disable-telemetry --skip-version-check --no-progress

      - name: scan exact frontend image
        run: |
          set -euo pipefail
          IMAGE_DIGEST=$(node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/frontend-image/identity.json", "utf8")); if (!/^sha256:[a-f0-9]{64}$/.test(report.index_digest)) throw Error("Invalid image digest"); process.stdout.write(report.index_digest);')
          node scripts/release/scan-frontend-image.mjs \
            --artifact "$RUNNER_TEMP/frontend-image" --image-digest "$IMAGE_DIGEST" \
            --cache-dir "$RUNNER_TEMP/frontend-scanner/cache" \
            --scanner "$RUNNER_TEMP/frontend-scanner/trivy" \
            --output "$RUNNER_TEMP/frontend-image/security"

      - name: expose verified frontend identity
        id: identity
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'frontend-image', 'identity.json'), 'utf8'));
          if (report.status !== 'pass' || report.source_dirty !== false || report.source_revision !== process.env.TARGET_SHA || typeof report.index_digest !== 'string' || report.index_digest.length !== 71 || !/^sha256:[a-f0-9]{64}$/.test(report.index_digest)) {
            throw new Error('Frontend image identity is missing or stale');
          }
          const security = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'frontend-image', 'security', 'report.json'), 'utf8'));
          if (security.status !== 'pass' || security.source_dirty !== false || security.source_revision !== report.source_revision || security.index_digest !== report.index_digest || security.counts?.HIGH !== 0 || security.counts?.CRITICAL !== 0) {
            throw new Error('Frontend image security evidence is missing or stale');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `digest=${report.index_digest}\nsource_revision=${report.source_revision}\n`);
          NODE

      - name: retain frontend OCI artifact and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-image-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/frontend-image
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
