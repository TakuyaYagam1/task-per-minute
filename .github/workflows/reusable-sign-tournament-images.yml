name: sign frontend release

on:
  workflow_call:
    inputs:
      source_revision:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
      image_digest:
        required: true
        type: string
    outputs:
      signed_artifact_name:
        description: Exact artifact containing the verified OCI layout and detached signature.
        value: ${{ jobs.sign.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  sign:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected && github.workflow_ref == format('{0}/.github/workflows/reusable-publish-tournament-images.yml@refs/heads/main', github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: frontend-release
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.signed.outputs.artifact_name }}
    env:
      SOURCE_REVISION: ${{ inputs.source_revision }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      SIGNED_ARTIFACT_NAME: frontend-signed-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: configure temporary paths
        run: |
          set -euo pipefail
          printf 'ARTIFACT_DIR=%s/frontend-image\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'TOOLS_DIR=%s/frontend-release-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: checkout trusted release code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.21.0

      - name: validate trusted build run before download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          [[ ${#BUILD_RUN_ID} -le 16 && "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api --hostname github.com "repos/$RELEASE_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/frontend-build-run.json"
          node scripts/release/prepare-frontend-publication.mjs validate-run \
            --metadata "$RUNNER_TEMP/frontend-build-run.json" --repository "$RELEASE_REPOSITORY" \
            --run-id "$BUILD_RUN_ID" --revision "$SOURCE_REVISION"

      - name: download exact trusted frontend artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: frontend-image-${{ inputs.source_revision }}
          path: ${{ runner.temp }}/frontend-image
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: validate frontend publication inputs
        id: prepare
        run: |
          set -euo pipefail
          node scripts/release/prepare-frontend-publication.mjs prepare \
            --artifact "$ARTIFACT_DIR" --repository "$RELEASE_REPOSITORY" \
            --revision "$SOURCE_REVISION" --digest "$IMAGE_DIGEST" \
            --lockfile "$GITHUB_WORKSPACE/frontend/package-lock.json" --github-output "$GITHUB_OUTPUT"

      - name: install pinned release tools
        run: bash scripts/release/install-frontend-release-tools.sh --output "$TOOLS_DIR"

      - name: refresh scanner database
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$TOOLS_DIR" "$TOOLS_DIR/trivy" image --config /dev/null \
            --cache-dir "$TOOLS_DIR/cache" --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --download-db-only --disable-telemetry --skip-version-check --no-progress

      - name: scan exact frontend image for release
        run: |
          set -euo pipefail
          node scripts/release/scan-frontend-image.mjs \
            --artifact "$ARTIFACT_DIR" --image-digest "$IMAGE_DIGEST" \
            --cache-dir "$TOOLS_DIR/cache" --scanner "$TOOLS_DIR/trivy" \
            --output "$ARTIFACT_DIR/signing-security"

      - name: sign verified OCI index blob
        env:
          INDEX_BLOB: ${{ steps.prepare.outputs.index_blob }}
        run: |
          set -euo pipefail
          umask 077
          [[ ! -e "$ARTIFACT_DIR/signature.sigstore.json" && ! -L "$ARTIFACT_DIR/signature.sigstore.json" ]] || exit 1
          "$TOOLS_DIR/cosign" sign-blob --yes --oidc-provider github-actions \
            --bundle "$ARTIFACT_DIR/signature.sigstore.json" "$INDEX_BLOB"

      - name: verify detached signature and release gate
        env:
          IMAGE_REF: ${{ steps.prepare.outputs.image_ref }}
        run: |
          set -euo pipefail
          node scripts/release/verify-frontend-release.mjs \
            --artifact "$ARTIFACT_DIR" --bundle "$ARTIFACT_DIR/signature.sigstore.json" \
            --image-ref "$IMAGE_REF" --repository "$RELEASE_REPOSITORY" --revision "$SOURCE_REVISION" \
            --cosign "$TOOLS_DIR/cosign" --output "$ARTIFACT_DIR/signature-gate.json"

      - name: upload signed frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.SIGNED_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/frontend-image
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: expose signed artifact name
        id: signed
        run: printf 'artifact_name=%s\n' "$SIGNED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
