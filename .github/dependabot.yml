version: 2

multi-ecosystem-groups:
  dependencies:
    target-branch: dev
    open-pull-requests-limit: 1
    schedule:
      interval: daily

updates:
  - package-ecosystem: gomod
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: npm
    directory: /frontend
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /test-data/importer
    patterns: ["*"]
    multi-ecosystem-group: dependencies
